[flake8]
max-line-length = 79
exclude =
    .git,
    __pycache__,
    venv,
    venv_torch,
    media,
    pretrained_models,
    output_*

[tool:pytest]
testpaths = tests
markers =
    lento: procesa un video real con los modelos de IA (unos 40 s)
    red: usa servicios externos (Firebase Cloud Messaging)
