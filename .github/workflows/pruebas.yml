# Integración continua del servidor: estándar de codificación (PEP 8) y
# pruebas automáticas en cada cambio. El despliegue lo hace el propio
# servidor cuando la rama main cambia (deploy/despliegue.timer).
name: Pruebas del servidor

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: karaoke
          POSTGRES_PASSWORD: karaoke
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      DB_USER: karaoke
      DB_PASSWORD: karaoke
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: media_db
      TEST_DB_NAME: media_db_test
      JWT_SECRET_KEY: clave-solo-para-pruebas
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Estándar de codificación (PEP 8)
        run: |
          flake8 app tests
          black --check -l 79 app tests

      - name: Pruebas
        run: pytest -q -m "not lento and not red"
